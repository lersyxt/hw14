
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Позиционирование в CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">МойСайт</div>
    <nav>
      <a href="#">Главная</a>
      <a href="#">Каталог</a>
    </nav>
  </header>

  <main class="content">
    <h2>Задание 1: Бейдж на карточке</h2>
    <div class="product-card">
      <span class="badge">NEW</span>
      <h3>Беспроводные наушники</h3>
      <p>Отличный звук и шумоподавление.</p>
    </div>

    <div class="scroll-box">
      <p>Прокрутите страницу вниз, чтобы проверить работу фиксированной шапки из Задания 2.</p>
    </div>
  </main>

  <div class="modal-overlay">
    <div class="modal-window">
      <h3>Задание 3: Модальное окно</h3>
      <p>Оно расположено строго по центру экрана поверх всех элементов страницы.</p>
      <button class="close-btn">Понятно</button>
    </div>
  </div>

</body>
</html>
